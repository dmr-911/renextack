# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchstack
      POSTGRES_PASSWORD: launchstack
      POSTGRES_DB: launchstack
    ports:
      - "5432:5432"
    volumes:
      - launchstack-postgres:/var/lib/postgresql/data
      - ./scripts/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchstack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  launchstack-postgres:
